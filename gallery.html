<body>
    <!-- Navigation -->
    <nav id="navbar" class="scrolled">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">FN</a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">

            </ul>

    <section class="section" style="padding-top: 120px;">

            <h2 class="section-title">Gallery</h2>
            <p class="section-subtitle">Moments from conferences, talks, courses, and collaborations.</p>
            <div class="gallery-filters" id="gallery-filters">
                <button class="filter-btn active" data-gallery-filter="all">All</button>
                <button class="filter-btn" data-gallery-filter="conference">Conferences</button>
                <button class="filter-btn" data-gallery-filter="teaching">Teaching</button>

        <div class="gallery-lightbox-caption" id="lightboxCaption"></div>
    </div>
